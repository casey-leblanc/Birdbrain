# Builds the experimental Windows app on GitHub's Windows machine, checks the build with its own self-test, starts it
# the way a student would, and attaches the zip to a pre-release. Nothing is published unless every step passes, and
# nothing here ever makes a normal release: experimental builds are pre-releases tagged exp-<version>-<commit>.
name: Build experimental app

on:
  push:
    branches: [birdbrain-experimental]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  page:
    # The list page itself, driven in a real browser with invented data: what a student sees and touches.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r birdbrain/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test
        run: python -m unittest discover tests
      - name: Test the page in a browser
        run: python -m unittest discover tests/ui

  windows:
    needs: page
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the release notes list the commits since the last pre-release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r birdbrain/requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover tests

      - name: Build
        run: python build.py

      - name: Self-test the build
        id: selftest
        shell: pwsh
        timeout-minutes: 10
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath selftest
          Start-Process -FilePath selftest\Birdbrain\Birdbrain.exe -ArgumentList '--selftest', "$PWD\selftest-result.txt" -Wait
          Get-Content selftest-result.txt
          if (-not (Select-String -Path selftest-result.txt -Pattern '^ALL PASS$' -Quiet)) { throw "The packaged app failed its self-test" }
          Start-Process -FilePath selftest\Birdbrain\Birdbrain.exe -ArgumentList '--build-info', "$PWD\build-info.json" -Wait
          $info = Get-Content build-info.json | ConvertFrom-Json
          $want = "$($env:GITHUB_SHA.Substring(0, 7))"
          if ($info.commit -ne $want) { throw "The build says it is $($info.tag), not commit $want" }
          if (-not $info.tag.StartsWith('exp-')) { throw "An experimental build must be tagged exp-, not $($info.tag)" }
          "tag=$($info.tag)" >> $env:GITHUB_OUTPUT
          "version=$($info.version)" >> $env:GITHUB_OUTPUT

      - name: Start the app for real
        # The self-test doesn't go through a normal start. This does: the app must come up and stay up, and a
        # second copy must hand over to it and leave (not sit behind an "already running" box).
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:APPDATA = "$PWD\launch-data"
          New-Item -ItemType Directory $env:APPDATA | Out-Null
          $exe = "$PWD\selftest\Birdbrain\Birdbrain.exe"
          $log = "$env:APPDATA\Birdbrain\birdbrain.log"
          $first = Start-Process -FilePath $exe -ArgumentList '--background' -PassThru
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $first.HasExited; $i++) {
            Start-Sleep 1
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'List page served' -Quiet)) { $up = $true; break }
          }
          if (Test-Path $log) { Get-Content $log }
          if (-not $up) { throw "Birdbrain didn't start (exited: $($first.HasExited))" }
          foreach ($n in 1, 2) {
            $again = Start-Process -FilePath $exe -ArgumentList '--background' -PassThru
            if (-not $again.WaitForExit(30000)) { $again.Kill(); throw "A second copy didn't hand over and leave" }
          }
          # The system-wide shortcut for quick write: Windows must have given it to Birdbrain. Then press it, as a
          # student would, and see the small quick write window open without an error.
          $ready = 'Quick write shortcut: Ctrl\+Alt\+Space'
          for ($i = 0; $i -lt 20 -and -not (Select-String -Path $log -Pattern $ready -Quiet); $i++) { Start-Sleep 1 }
          if (-not (Select-String -Path $log -Pattern $ready -Quiet)) { Get-Content $log; throw "The quick write shortcut wasn't registered" }
          Add-Type -Namespace Win -Name Keys -MemberDefinition '[DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, System.UIntPtr extra);'
          foreach ($vk in 0x11, 0x12, 0x20) { [Win.Keys]::keybd_event($vk, 0, 0, [UIntPtr]::Zero) }
          foreach ($vk in 0x20, 0x12, 0x11) { [Win.Keys]::keybd_event($vk, 0, 2, [UIntPtr]::Zero) }
          $opened = 'Quick write opened by its shortcut'
          for ($i = 0; $i -lt 15 -and -not (Select-String -Path $log -Pattern $opened -Quiet); $i++) { Start-Sleep 1 }
          if (Select-String -Path $log -Pattern $opened -Quiet) { "PRESSED: Ctrl+Alt+Space reached Birdbrain and opened quick write." }
          else { "NOT PRESSED: this machine didn't deliver the simulated key press, so only the registration was checked." }
          Start-Sleep 5
          if ($first.HasExited) { throw "Birdbrain stopped by itself (exit code $($first.ExitCode))" }
          if (Select-String -Path $log -Pattern 'Traceback|CRITICAL' -Quiet) { throw "Birdbrain logged an error while starting" }
          taskkill /PID $first.Id /T /F | Out-Null
          "Started, stayed up, and two more copies handed over to it."

      - name: Update for real
        # The updater's last steps on a real Windows machine: a copy that says it is an older build installs this
        # build from its zip, the script swaps the files once that copy has quit, and the new version starts.
        shell: pwsh
        timeout-minutes: 6
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath update-test
          $app = "$PWD\update-test\Birdbrain"
          $stamp = "$app\_internal\assets\build.json"
          '{"version": "0.0.1", "commit": "0000000", "tag": "exp-0.0.1-0000000"}' | Set-Content -Encoding utf8NoBOM $stamp
          "left over from the old version" | Set-Content "$app\_internal\stale.txt"
          $env:LOCALAPPDATA = "$PWD\update-local"
          New-Item -ItemType Directory $env:LOCALAPPDATA | Out-Null
          $after = "$PWD\after-update.json"
          $old = Start-Process -FilePath "$app\Birdbrain.exe" -ArgumentList '--install-update', $zip.FullName, '--build-info', $after -PassThru
          if (-not $old.WaitForExit(150000)) { $old.Kill(); throw "The old version didn't hand over and quit" }
          for ($i = 0; $i -lt 180 -and -not (Test-Path $after); $i++) { Start-Sleep 1 }
          $dir = "$env:LOCALAPPDATA\Birdbrain-update"
          if (Test-Path "$dir\update.log") { Get-Content "$dir\update.log" }
          if (Test-Path "$dir\result.json") { Get-Content "$dir\result.json" }
          if (-not (Test-Path $after)) { throw "The new version was never started after the swap" }
          $want = "${{ steps.selftest.outputs.tag }}"
          $now = Get-Content $after | ConvertFrom-Json
          if ($now.tag -ne $want) { throw "After the update the app says it is $($now.tag), not $want" }
          $result = Get-Content "$dir\result.json" | ConvertFrom-Json
          if (-not $result.ok) { throw "The update script reported a failure" }
          if (Test-Path "$app\_internal\stale.txt") { throw "A file from the old version was left behind" }
          if (-not (Test-Path "$dir\previous\_internal\stale.txt")) { throw "The version in use wasn't kept as a backup" }
          "Updated from exp-0.0.1-0000000 to $($now.tag), kept the old version, and started the new one."

      - uses: actions/upload-artifact@v4
        with:
          name: Birdbrain-windows
          path: |
            dist/*.zip
            selftest-result.txt
          if-no-files-found: error

      - name: Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.selftest.outputs.tag }}
          VERSION: ${{ steps.selftest.outputs.version }}
        run: |
          # what's new: the subject of each commit since the experimental build before this one
          previous=$(gh release list --limit 30 --json tagName --jq '[.[].tagName | select(startswith("exp-"))][0] // ""' || true)
          if [ -n "$previous" ] && git rev-parse -q --verify "refs/tags/$previous" >/dev/null; then
            git log --no-merges --format='- %s' "$previous..HEAD" > notes.md
          else
            git log --no-merges --format='- %s' -1 > notes.md
          fi
          [ -s notes.md ] || echo "- Rebuilt" > notes.md
          gh release create "$TAG" dist/*.zip selftest-result.txt --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Birdbrain experimental $VERSION (${GITHUB_SHA::7})" --notes-file notes.md
